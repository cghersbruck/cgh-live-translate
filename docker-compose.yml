# Bereitstellung der Live-Uebersetzung mit lokal betriebenem LiveKit.
#
# Benoetigt werden nur zwei Dinge: diese Datei und die Variablen aus .env
# (Vorlage: .env.example). Bewusst keine zusaetzliche Konfigurationsdatei -
# LiveKit nimmt seine Konfiguration als Umgebungsvariable entgegen, damit der
# Stack sich unveraendert in Portainer einfuegen laesst.
#
#   docker compose pull && docker compose up -d
#
# Der Reverse Proxy im Netz proxy_net bedient zwei Namen:
#   uebersetzung.<domain>  ->  translate:8080
#   livekit.<domain>       ->  cgh-livekit:7880   (WebSocket-Upgrade noetig!)
#
# Der Medienverkehr laeuft NICHT ueber den Reverse Proxy, sondern direkt auf
# die unten veroeffentlichten Ports 7881/tcp und 7882/udp.

services:
  translate:
    image: ${IMAGE}
    container_name: cgh-live-translate
    restart: unless-stopped
    depends_on:
      - cgh-livekit
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

      # Adresse aus Sicht des BESUCHER-HANDYS. Geht per API an den Browser.
      # Muss von aussen erreichbar und per TLS abgesichert sein.
      LIVEKIT_URL: ${LIVEKIT_URL}

      # Adresse aus Sicht des SERVERS. Die Uebersetzer-Bridge laeuft im
      # Container und erreicht LiveKit direkt im Docker-Netz - ohne Umweg
      # ueber Reverse Proxy und Router. Ohne diese Trennung scheitert die
      # Bridge auf vielen Routern an fehlendem NAT-Hairpin, und zwar erst,
      # wenn der erste Hoerer eine Sprache waehlt.
      LIVEKIT_URL_INTERNAL: ${LIVEKIT_URL_INTERNAL:-ws://cgh-livekit:7880}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BROADCAST_PASSWORD: ${BROADCAST_PASSWORD}

      # Vorbelegung der Event-ID auf der Startseite, z. B. "cgh". Ergibt die
      # dauerhafte Hoerer-Adresse /session/<id>/watch fuer Links und QR-Codes.
      # Leer = zufaellige ID bei jedem Anlegen.
      DEFAULT_EVENT_ID: ${DEFAULT_EVENT_ID:-}

      # Eingangsrate an Gemini: 48000 (Standard) oder 16000. Am 2026-10-04
      # wurde die Eingabe mit Faktor 3 abgerechnet - vermutlich wegen 48 kHz.
      # Erst nach A/B-Test auf 16000 umstellen. Am Mischpult aendert sich nichts.
      GEMINI_INPUT_SAMPLE_RATE: ${GEMINI_INPUT_SAMPLE_RATE:-48000}

      # Optional: Wechselkurs fuer die Kostenanzeige in Euro, z. B. 0.86.
      # Leer = Anzeige nur in Dollar.
      KOSTEN_USD_EUR: ${KOSTEN_USD_EUR:-}
      NODE_ENV: production
      PORT: "8080"
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - proxy_net
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dienstname bewusst gleich dem Containernamen. Im DNS registriert sich der
  # SERVICE-Name, nicht container_name - "livekit" waere im geteilten Netz
  # proxy_net aber zu generisch und koennte mit einem anderen Stack kollidieren.
  cgh-livekit:
    # Auf die Nebenversion gepinnt statt latest: Ein unbemerkter Sprung auf
    # eine neue Hauptversion waere am Sonntagmorgen die denkbar schlechteste
    # Ueberraschung. v1.13 holt weiterhin Fehlerkorrekturen.
    image: livekit/livekit-server:v1.13
    container_name: cgh-livekit
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}

      # Vollstaendige LiveKit-Konfiguration. Die Werte kommen aus der .env,
      # die Schluessel stehen damit nur an EINER Stelle.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          # Ein einziger UDP-Port statt des Standardbereichs 50000-60000.
          # LiveKit multiplext allen Medienverkehr darueber - das macht die
          # Portfreigabe im Router zu einer Zeile statt zehntausend.
          udp_port: 7882
          # Rueckfallweg, wenn UDP blockiert ist. In Gaeste-WLANs haeufig.
          tcp_port: 7881
          # Im Docker-Bridge-Netz kennt der Container nur seine interne
          # 172er-Adresse. Die nuetzt den Handys nichts, daher muss die
          # erreichbare Adresse ausdruecklich gesetzt werden.
          #
          # ACHTUNG: use_external_ip hat VORRANG. node_ip wirkt nur, wenn
          # hier ausdruecklich false steht.
          #   false + node_ip -> Besucher im Haus (der Normalfall)
          #   true            -> Besucher aus dem Internet
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP}
        keys:
          "${LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET}"
        logging:
          level: info
          json: false
    ports:
      # Signalisierung (7880) wird bewusst NICHT veroeffentlicht - die laeuft
      # ueber den Reverse Proxy, der fuer TLS sorgt. Handys verbinden sich
      # ueber wss://, und das verlangt ein gueltiges Zertifikat.

      # Medienverkehr dagegen kann kein HTTP-Proxy weiterreichen und muss
      # direkt erreichbar sein:
      - "${LIVEKIT_TCP_PORT:-7881}:7881/tcp"   # Rueckfall, wenn UDP blockiert
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"   # eigentlicher Medienverkehr
    networks:
      - proxy_net
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Falls LiveKit nicht startet, sind diese beiden Zeilen der erste
    # Verdacht - sie sind in diesem Aufbau nicht erprobt.
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy_net:
    external: true
