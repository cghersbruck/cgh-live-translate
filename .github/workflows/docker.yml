# Baut das Container-Image und veroeffentlicht es in der GitHub Container
# Registry (GHCR). Ziel: Auf dem Server ist anschliessend nur noch die
# docker-compose.yml noetig - kein Quellcode, kein Build, kein Node.
#
# Warum GHCR und nicht Docker Hub: Das GITHUB_TOKEN reicht zur Anmeldung, es
# sind also keine zusaetzlichen Secrets einzurichten.

name: Docker-Image bauen und veroeffentlichen

# Veroeffentlicht wird ausschliesslich von main.
#
# Zuvor loesten main und gemeinde beide einen Build aus. Da beide auf denselben
# Commit zeigen, lief derselbe Quellstand zweimal durch und erzeugte zwei
# verschiedene Digests - der Tag sha-<commit> wurde dann vom spaeter fertigen
# Lauf ueberschrieben und war damit mehrdeutig. Genau dieser Tag soll aber ein
# verlaessliches Zurueckrollen erlauben.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Erst pruefen, dann bauen. Ein Image, das nicht typpruefbar ist, soll gar
  # nicht erst in der Registry landen.
  pruefen:
    name: Typen und Lint pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Typpruefung ueber das gesamte Projekt - die ist upstream sauber.
      - name: TypeScript pruefen
        run: npx tsc --noEmit

      # Lint bewusst nur auf selbst geschriebenem Code, und dort streng.
      #
      # Der Upstream hat 17 offene Lint-Befunde (vor allem `any`-Typen in
      # broadcast/page.tsx, watch/page.tsx und api/sessions/route.ts). Die
      # werden NICHT behoben: Das waeren Aenderungen an Upstream-Dateien, die
      # bei jedem `git pull` vom Upstream Konflikte erzeugen - und die Regel
      # fuer dieses Projekt lautet minimal-invasive Diffs.
      #
      # Wuerde hier das ganze Projekt gelintet, produzierte jeder Lauf 17
      # Annotationen, die niemand mehr liest. Dann faellt ein echter Fehler in
      # unserem Code nicht mehr auf. Deshalb dieser Zuschnitt.
      - name: Lint (nur eigener Code)
        run: npx eslint src/config src/components src/lib/broadcast-control.ts src/lib/gemini-stoerung.ts src/lib/kosten.ts src/app/api/control src/app/api/config scripts --no-error-on-unmatched-pattern

      - name: Produktionsbuild
        run: npm run build

  bauen:
    name: Image bauen und pushen
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # QEMU und Buildx, damit auch arm64 gebaut werden kann. Synology-NAS
      # gibt es sowohl mit x86_64 als auch mit ARM-CPU; welche Variante hier
      # zum Einsatz kommt, steht noch nicht fest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Bei Pull Requests nur bauen, nicht veroeffentlichen.
      - name: An GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # latest haengt am Standardbranch des Repositories (main), nicht an
            # einem fest verdrahteten Namen. So bleibt es richtig, falls der
            # Arbeitsbranch spaeter anders heisst.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis zusammenfassen
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Image veroeffentlicht"
            echo ""
            echo "Auf dem Server genuegt jetzt:"
            echo ""
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
